<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="system-ui, Segoe UI, sans-serif">
  <style>
    .b { transform-box: fill-box; transform-origin: bottom; animation: grow 1s cubic-bezier(.2,.8,.2,1) both; }
    .b:nth-of-type(2) { animation-delay: .08s } .b:nth-of-type(3) { animation-delay: .16s } .b:nth-of-type(4) { animation-delay: .24s }
    .b:nth-of-type(5) { animation-delay: .32s } .b:nth-of-type(6) { animation-delay: .4s } .b:nth-of-type(7) { animation-delay: .48s }
    .spike { animation: grow 1s cubic-bezier(.2,.8,.2,1) .55s both, blink 1.6s ease-in-out 1.6s infinite; }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes blink { 50% { opacity: .55; } }
    .thr { stroke-dasharray: 6 6; animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
  </style>
  <rect width="480" height="340" rx="22" fill="#dce8e2"/>
  <rect x="26" y="26" width="428" height="288" rx="16" fill="#fff"/>
  <text x="48" y="58" font-size="14" font-weight="700" fill="#12332f">Cancellations in the last hour, by account</text>
  <g stroke="#e3ece7" stroke-width="1">
    <line x1="48" x2="432" y1="110" y2="110"/><line x1="48" x2="432" y1="160" y2="160"/>
    <line x1="48" x2="432" y1="210" y2="210"/><line x1="48" x2="432" y1="260" y2="260"/>
  </g>
  <line x1="48" x2="432" y1="152" y2="152" stroke="#e5472b" stroke-width="2" class="thr"/>
  <text x="436" y="148" font-size="10" fill="#e5472b" text-anchor="end">Normal limit</text>
  <rect class="b" x="62" y="230" width="34" height="30" rx="5" fill="#3e8a50"/>
  <rect class="b" x="110" y="215" width="34" height="45" rx="5" fill="#3e8a50"/>
  <rect class="b" x="158" y="238" width="34" height="22" rx="5" fill="#3e8a50"/>
  <rect class="b spike" x="206" y="86" width="34" height="174" rx="5" fill="#e5472b"/>
  <rect class="b" x="254" y="222" width="34" height="38" rx="5" fill="#3e8a50"/>
  <rect class="b" x="302" y="240" width="34" height="20" rx="5" fill="#3e8a50"/>
  <rect class="b" x="350" y="226" width="34" height="34" rx="5" fill="#3e8a50"/>
  <g transform="translate(250 70)">
    <rect width="150" height="34" rx="10" fill="#12332f"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#fff">7 cancels in 30 min</text>
  </g>
  <text x="48" y="290" font-size="11" fill="#587069">Account A to G</text>
</svg>
