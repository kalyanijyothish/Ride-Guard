  <g transform="translate(236 214)">
    <rect width="150" height="46" rx="12" fill="#12332f"/>
    <text x="14" y="20" font-size="11" fill="#9fc1b8">Congested ahead</text>
    <text x="14" y="37" font-size="13" font-weight="700" fill="#fff">Detour saves 7 min</text>
