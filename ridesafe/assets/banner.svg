<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" preserveAspectRatio="xMidYMax slice">
  <style>
    .win { fill: #f5b82e; opacity: .0; animation: lit 6s ease-in-out infinite; }
    .w2 { animation-delay: -2s } .w3 { animation-delay: -4s } .w4 { animation-delay: -1s }
    @keyframes lit { 0%, 100% { opacity: 0 } 40%, 70% { opacity: .85 } }
    .lane { stroke-dasharray: 26 22; animation: lane 1.4s linear infinite; }
    @keyframes lane { to { stroke-dashoffset: -48; } }
    .car1 { animation: drive 11s linear infinite; }
    .car2 { animation: drive 17s linear -6s infinite; }
    @keyframes drive { from { transform: translateX(-80px); } to { transform: translateX(1280px); } }
    .scan { animation: scan 7s ease-in-out infinite; }
    @keyframes scan { 0% { transform: translateX(-200px); opacity: 0 } 15%, 85% { opacity: .5 } 100% { transform: translateX(1300px); opacity: 0 } }
  </style>
  <g fill="#1d4a44">
    <rect x="30" y="70" width="70" height="100"/><rect x="110" y="40" width="54" height="130"/><rect x="176" y="84" width="80" height="86"/>
    <rect x="300" y="52" width="64" height="118"/><rect x="376" y="90" width="90" height="80"/><rect x="520" y="30" width="58" height="140"/>
    <rect x="590" y="70" width="84" height="100"/><rect x="720" y="48" width="66" height="122"/><rect x="800" y="92" width="94" height="78"/>
    <rect x="950" y="36" width="60" height="134"/><rect x="1022" y="76" width="86" height="94"/><rect x="1120" y="56" width="70" height="114"/>
  </g>
  <g fill="#24574f">
    <rect x="270" y="100" width="22" height="70"/><rect x="480" y="110" width="30" height="60"/><rect x="900" y="100" width="40" height="70"/><rect x="680" y="110" width="30" height="60"/>
  </g>
  <rect class="win" x="122" y="58" width="8" height="8"/><rect class="win w2" x="140" y="76" width="8" height="8"/>
  <rect class="win w3" x="312" y="70" width="8" height="8"/><rect class="win w4" x="330" y="92" width="8" height="8"/>
  <rect class="win w2" x="532" y="48" width="8" height="8"/><rect class="win" x="548" y="72" width="8" height="8"/>
  <rect class="win w3" x="732" y="66" width="8" height="8"/><rect class="win w4" x="748" y="88" width="8" height="8"/>
  <rect class="win" x="962" y="54" width="8" height="8"/><rect class="win w2" x="978" y="78" width="8" height="8"/>
  <rect class="win w4" x="1134" y="74" width="8" height="8"/>
  <rect x="0" y="140" width="1200" height="30" fill="#0d2623"/>
  <line x1="0" x2="1200" y1="156" y2="156" stroke="#f5b82e" stroke-width="2" class="lane" opacity=".7"/>
  <g class="car1"><rect x="0" y="143" width="34" height="11" rx="5" fill="#f5b82e"/><rect x="8" y="138" width="16" height="8" rx="3" fill="#f5b82e"/><circle cx="8" cy="155" r="3" fill="#0d2623" stroke="#9fc1b8"/><circle cx="26" cy="155" r="3" fill="#0d2623" stroke="#9fc1b8"/></g>
  <g class="car2"><rect x="0" y="143" width="34" height="11" rx="5" fill="#9fc1b8"/><rect x="8" y="138" width="16" height="8" rx="3" fill="#9fc1b8"/><circle cx="8" cy="155" r="3" fill="#0d2623" stroke="#9fc1b8"/><circle cx="26" cy="155" r="3" fill="#0d2623" stroke="#9fc1b8"/></g>
  <rect class="scan" x="0" y="0" width="3" height="170" fill="#5fd6a3"/>
</svg>
